<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CE-CSL 数据集受限手语识别原型</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <main class="shell">
      <header>
        <p class="eyebrow">GROUP 11 - DATASET-BOUNDED RESEARCH PROTOTYPE</p>
        <h1>CE-CSL 数据集受限手语识别</h1>
        <p class="lead">
          上传或录制一段短视频。系统以 CE-CSL 数据集中的 gloss/token
          范围为识别边界，展示预测标签、置信度、延迟和受限中文重构结果。
        </p>
        <div id="system-status" class="status">正在检查模型状态...</div>
      </header>

      <main class="card-column">
        <section class="card video-card">
          <div class="visual" id="visual-stage">
            <video id="preview" autoplay muted playsinline></video>
            <div class="placeholder" id="placeholder">
              <svg viewBox="0 0 24 24" width="34" height="34" fill="none" stroke="currentColor" stroke-width="1.5">
                <circle cx="12" cy="13" r="4"/>
                <path d="M4 8h2l1.5-2h3L12 8h8v10H4z" stroke-linejoin="round"/>
              </svg>
              <p>视频将在此预览</p>
              <span>支持上传视频文件</span>
            </div>
          </div>

      <section class="panel result-panel" aria-live="polite">
        <div class="result-heading">
          <h2>识别结果</h2>
          <span id="result-status" class="badge">等待输入</span>
        </div>
        <p id="result-text" class="result-text">完成录制或选择视频后开始。</p>
        <dl class="details">
          <div><dt>Label</dt><dd id="result-label">-</dd></div>
          <div><dt>Gloss Tokens</dt><dd id="result-gloss-tokens">-</dd></div>
          <div><dt>Confidence</dt><dd id="result-confidence">-</dd></div>
          <div><dt>Latency</dt><dd id="result-latency">-</dd></div>
        </dl>
        <ul id="warnings" class="warnings"></ul>
      </section>
    </main>
    <script src="/static/app.js"></script>
  </body>
</html>
