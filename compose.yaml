services:
  app:
    build: .
    ports:
      - "${CSLR_PORT:-8088}:8000"
    environment:
      CSLR_MODEL_PATH: /workspace/artifacts/exports/lstm.onnx
      CSLR_DEMO_MODE: ${CSLR_DEMO_MODE:-false}
      CSLR_CONFIDENCE_THRESHOLD: ${CSLR_CONFIDENCE_THRESHOLD:-0.65}
    volumes:
      - ./artifacts:/workspace/artifacts
      - ./data:/workspace/data:ro
    environment:
      - CSLR_DEMO_MODE=false
      - CSLR_CONFIDENCE_THRESHOLD=0.65
      - CTC_MODEL_PATH=/workspace/artifacts/exports/ctc_model.onnx
      - CTC_VOCAB_PATH=/workspace/data/vocab.txt
    restart: unless-stopped
